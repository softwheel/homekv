name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
      - uses: actions/checkout@v4
      - name: Record verification environment
        run: |
          mkdir -p target/verification
          {
            git rev-parse HEAD
            rustc --version --verbose
            cargo --version
            uname -a
            lscpu
            free -h
            df -T .
            sha256sum Cargo.lock
            cargo tree --locked -i openraft
          } > target/verification/environment.txt
      - name: Build
        run: cargo build --locked --verbose
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --verbose --no-fail-fast 2>&1 | tee target/verification/tests.log
      - name: M0 storage benchmark smoke
        run: |
          cargo run --locked --bin hkvbench -- \
            --config benchmarks/configs/smoke-storage.json \
            --output target/hkvbench-smoke.json
      - name: M0 storage memory accounting smoke
        run: |
          cargo run --locked --bin hkvmem -- \
            --config benchmarks/configs/smoke-storage.json \
            --output target/hkvmem-storage-smoke.json
      - name: M0 server memory accounting smoke
        run: |
          cargo build --locked --bin homekv --bin hkvmem
          target/debug/hkvmem \
            --config benchmarks/configs/smoke-server.json \
            --homekv-bin target/debug/homekv \
            --output target/hkvmem-server-smoke.json
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/verification/
            target/hkvbench-smoke.json
            target/hkvmem-storage-smoke.json
            target/hkvmem-server-smoke.json
